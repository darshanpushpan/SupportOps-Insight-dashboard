{% extends "base.html" %}

{% block title %}Error {{ error_code }} - SupportOps Insight{% endblock %}

{% block content %}
<div class="container">
    <section class="card error-page">
        <div class="error-code">{{ error_code }}</div>
        <h1>Oops! Something went wrong</h1>
        <p>{{ error_message }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
    </section>
</div>
{% endblock %}
